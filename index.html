<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="mobile-web-app-capable" content="yes" />cd 
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>Monkey Mountain Madness</title>

<style>
  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .game-shell {
    width: 100vw;
    height: 100svh;
    min-height: 100svh;
    max-height: 100svh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    touch-action: none;
    background: #000;
  }

  #game {
    display: block;
    background: #000;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;

    aspect-ratio: 1080 / 1920;

    width: auto;
    height: 100svh;

    max-width: 100vw;
    max-height: 100svh;
  }

  @supports (height: 100dvh) {
    .game-shell {
      height: 100svh;
      min-height: 100svh;
      max-height: 100svh;
    }

    #game {
      height: 100svh;
      max-height: 100svh;
    }
  }
</style>
</head>
<body>
  <div class="game-shell">
    <canvas id="game" width="1080" height="1920"></canvas>
  </div>

<script src="js/howler.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
